name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for OIDC (takumi-guard)
      contents: read

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: flatt-security/setup-takumi-guard-pypi@v1
        with:
          bot-id: "BT01KP0J2WVXM2XRECK5RCT62XRH" # ayokura

      # Pinned to astral-sh/setup-uv v8.2.0 commit for supply-chain hardening.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "latest"
          enable-cache: true
          cache-suffix: test

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kalimba-dsp

      - name: Install dependencies (includes Rust extension build via maturin)
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest apps/api/tests -q
        env:
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMBA_OPT: "2"

  # wasm↔native 数値等価チェック (crates/kalimba-dsp/check_wasm.sh)。
  # test/web と独立した別ジョブにして、失敗の切り分けと将来の並列実行調整を
  # しやすくしておく (2026-07-03 ユーザー承認)。
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for OIDC (takumi-guard)
      contents: read

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: flatt-security/setup-takumi-guard-pypi@v1
        with:
          bot-id: "BT01KP0J2WVXM2XRECK5RCT62XRH" # ayokura

      # Pinned to astral-sh/setup-uv v8.2.0 commit for supply-chain hardening.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "latest"
          enable-cache: true
          cache-suffix: wasm

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Rust toolchain (with wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kalimba-dsp

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install dependencies (native kalimba_dsp reference build)
        run: uv sync --dev

      - name: wasm equivalence check
        run: crates/kalimba-dsp/check_wasm.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen
        working-directory: apps/web

      - name: Typecheck
        run: npm --workspace apps/web run lint

      - name: Unit tests
        run: npm --workspace apps/web run test

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: E2E smoke tests (production build)
        run: npm --workspace apps/web run e2e
