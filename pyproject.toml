[project]
name = "kalimba-transcription"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135.2",
    "kalimba-dsp",
    "numpy>=2.4.3",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.22",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
# librosa is NOT a runtime dependency — the recognizer is librosa-free (#193).
# It is used only by the analysis scripts/skills (scripts/audio-analysis/,
# .claude/skills/). Kept in dev so `uv run` (dev-default) still resolves it for
# those tools; a `uv sync --no-dev` prod install can drop it.
dev = [
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.5.0",
]

[[tool.uv.index]]
name = "takumi-guard"
url = "https://pypi.flatt.tech/simple/"
default = true

[tool.uv.sources]
kalimba-dsp = { path = "crates/kalimba-dsp", editable = true }
