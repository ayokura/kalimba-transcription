[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "kalimba-dsp"
version = "0.1.0"
description = "Rust DSP primitives for kalimba transcription"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# The `python` feature pulls in pyo3 + numpy and enables pyo3/extension-module.
# (See crates/kalimba-dsp/Cargo.toml [features].)
features = ["python"]
module-name = "kalimba_dsp"
